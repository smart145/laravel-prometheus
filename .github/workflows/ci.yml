name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [11.0, 12.0, 13.0]
        exclude:
          - php: 8.2
            laravel: 13.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    # The storage tests (tests/RedisStorageTestCase.php) need a real Redis.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, json
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 11 releases in range have security advisories; allow them for compatibility tests.
          composer config policy.advisories.block false
          composer require "illuminate/support:^${{ matrix.laravel }}" "illuminate/routing:^${{ matrix.laravel }}" "illuminate/http:^${{ matrix.laravel }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

